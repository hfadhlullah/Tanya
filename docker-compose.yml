services:
  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DEMO_ADMIN_KEY: ${DEMO_ADMIN_KEY}
      STORAGE_LOCAL_PATH: /app/uploads
      STORAGE_BASE_URL: ${STORAGE_BASE_URL}
      REQUESTY_API_KEY: ${REQUESTY_API_KEY}
      REQUESTY_BASE_URL: ${REQUESTY_BASE_URL:-https://router.requesty.ai/v1}
      REQUESTY_EMBEDDING_MODEL: ${REQUESTY_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      REQUESTY_CHAT_MODEL: ${REQUESTY_CHAT_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: build
    command: ["bunx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

  worker:
    build:
      context: ./backend
    command: ["bun", "dist/src/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      WORKER_MODE: "true"
      REQUESTY_API_KEY: ${REQUESTY_API_KEY}
      REQUESTY_BASE_URL: ${REQUESTY_BASE_URL:-https://router.requesty.ai/v1}
      REQUESTY_EMBEDDING_MODEL: ${REQUESTY_EMBEDDING_MODEL:-openai/text-embedding-3-small}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
